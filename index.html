<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sniper CRM</title>
  
  <!-- SEO & Mobile Config -->
  <meta name="description" content="Material Design 3 Git-Backed CRM with fully customizable fields.">
  <meta name="theme-color" content="#111318">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="logo.jpg">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'Roboto', 'sans-serif'],
          },
          colors: {
            material: {
              bg: '#111318',
              surface: '#1b1b1f',
              surfaceVariant: '#232429',
              primary: '#a8c7fa', // Google blue
              onPrimary: '#062e6f',
              primaryContainer: '#2b4470',
              onPrimaryContainer: '#d6e2ff',
              secondary: '#c2c6dc',
              secondaryContainer: '#2b2e3b',
              error: '#ffb4ab',
              onError: '#690005',
              outline: '#8e9099',
              outlineVariant: '#44474e',
              text: '#e3e2e6',
              textSecondary: '#c5c6d0',
              textMuted: '#90949f',
            }
          }
        }
      }
    }
  </script>

  <style>
    * {
      -webkit-tap-highlight-color: transparent;
    }
    
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-track {
      background: #111318;
    }
    ::-webkit-scrollbar-thumb {
      background: #44474e;
      border-radius: 999px;
    }
    
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-material-bg text-material-text min-h-screen font-sans flex flex-col antialiased">

  <!-- Top App Header -->
  <header class="sticky top-0 z-40 bg-material-bg/95 backdrop-blur-md px-4 py-3 border-b border-material-outlineVariant/20 flex flex-col gap-2">
    <div class="flex items-center gap-2">
      <!-- Search Input -->
      <div class="flex-grow flex items-center gap-3 bg-material-surfaceVariant px-4 py-2.5 rounded-full border border-material-outlineVariant/30 shadow-md">
        <div class="w-6 h-6 shrink-0 flex items-center justify-center border border-material-primary/60 rounded-full bg-material-primary/10">
          <span class="w-1 h-1 bg-material-primary rounded-full"></span>
        </div>
        <input type="text" id="search-input" oninput="filterClients()" placeholder="Search company, DM, pitch..." class="w-full bg-transparent text-sm text-material-text placeholder-material-textMuted focus:outline-none">
        
        <div id="sync-badge" class="hidden shrink-0 text-[9px] font-bold tracking-wider uppercase px-2 py-0.5 rounded bg-amber-500/10 text-amber-400 border border-amber-500/20">
          Unsaved
        </div>
      </div>
      
      <!-- Add Target Button -->
      <button onclick="openClientModal(null)" class="shrink-0 flex items-center justify-center bg-material-primaryContainer text-material-onPrimaryContainer border border-material-primary/30 p-2.5 rounded-full hover:bg-material-surfaceVariant transition-colors" title="Add New Lead">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"></path>
        </svg>
      </button>
    </div>

    <!-- M3 Chips -->
    <div class="flex items-center gap-2 overflow-x-auto no-scrollbar py-1">
      <button onclick="setFilter('All')" class="tab-chip shrink-0 px-4 py-1.5 rounded-full text-xs font-medium border border-material-primary bg-material-primaryContainer text-material-onPrimaryContainer transition-colors">
        All
      </button>
      <button onclick="setFilter('Target Locked')" class="tab-chip shrink-0 px-4 py-1.5 rounded-full text-xs font-medium border border-material-outline text-material-textSecondary hover:bg-material-surfaceVariant transition-colors">
        Locked
      </button>
      <button onclick="setFilter('Warm Contact')" class="tab-chip shrink-0 px-4 py-1.5 rounded-full text-xs font-medium border border-material-outline text-material-textSecondary hover:bg-material-surfaceVariant transition-colors">
        Pitching
      </button>
      <button onclick="setFilter('Closed Won')" class="tab-chip shrink-0 px-4 py-1.5 rounded-full text-xs font-medium border border-material-outline text-material-textSecondary hover:bg-material-surfaceVariant transition-colors">
        Won
      </button>
      <button onclick="setFilter('Closed Lost')" class="tab-chip shrink-0 px-4 py-1.5 rounded-full text-xs font-medium border border-material-outline text-material-textSecondary hover:bg-material-surfaceVariant transition-colors">
        Lost
      </button>
    </div>
  </header>

  <!-- Summary Stats Bar -->
  <section class="px-4 py-2 mt-1">
    <div class="flex items-center justify-between text-[11px] text-material-textMuted font-mono border-b border-material-outlineVariant/10 pb-1.5">
      <div>PIPELINE: <span id="stat-total" class="text-material-primary font-bold">0</span></div>
      <div class="flex gap-3">
        <div>LKD: <span id="stat-locked" class="text-amber-400">0</span></div>
        <div>PCH: <span id="stat-pitching" class="text-indigo-300">0</span></div>
        <div>WON: <span id="stat-won" class="text-emerald-400">0</span></div>
      </div>
    </div>
  </section>

  <!-- Main Grid List -->
  <main class="flex-grow px-4 py-4 max-w-2xl mx-auto w-full pb-28">
    <div id="clients-container" class="flex flex-col gap-4">
      <div class="bg-material-surface border border-material-outlineVariant/20 rounded-[24px] p-5 animate-pulse flex flex-col gap-4">
        <div class="h-5 bg-material-surfaceVariant rounded w-2/3"></div>
        <div class="h-4 bg-material-surfaceVariant rounded w-1/3"></div>
      </div>
    </div>
  </main>

  <!-- PWA Install Banner -->
  <div id="pwa-banner" class="hidden fixed bottom-24 left-4 right-4 bg-material-surface border border-material-outlineVariant/40 rounded-[20px] p-3 shadow-2xl z-40 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <img src="logo.jpg" alt="Logo" class="w-8 h-8 rounded-lg">
      <div class="text-xs">
        <p class="font-bold text-material-text">Install CRM Web App</p>
      </div>
    </div>
    <button id="pwa-install-btn" class="px-3.5 py-1 bg-material-primary text-material-onPrimary rounded-full text-xs font-bold transition-colors">Install</button>
  </div>

  <!-- Sync Master FAB -->
  <button id="save-btn" onclick="openAuthModal()" class="fixed bottom-6 right-6 flex items-center justify-center gap-2 bg-[#a8c7fa] hover:bg-[#c4d7ff] text-[#062e6f] font-semibold py-4.5 px-5 rounded-[16px] shadow-lg transition-transform hover:scale-105 active:scale-95 z-40">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path>
    </svg>
    <span class="text-sm tracking-wide">Save to Git</span>
  </button>

  <!-- On-Demand GitHub Authentication Modal -->
  <div id="auth-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
    <div class="bg-material-surface w-full max-w-sm rounded-[28px] p-6 border border-material-outlineVariant/30 shadow-2xl relative">
      <button onclick="closeAuthModal()" class="absolute top-4 right-4 text-material-textMuted hover:text-material-text transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
      <div class="text-center mb-5">
        <h3 class="text-base font-bold text-material-text">Enter GitHub PAT to Commit</h3>
        <p class="text-xs text-material-textMuted mt-1">Authenticate to save updates to GitHub</p>
      </div>
      <div class="space-y-4">
        <input type="password" id="pat-input" placeholder="ghp_..." autocomplete="off" class="w-full px-4 py-3 rounded-xl text-sm bg-material-bg border border-material-outlineVariant text-material-text focus:outline-none focus:border-material-primary font-mono">
        <div class="flex gap-2">
          <button onclick="closeAuthModal()" class="flex-1 py-2.5 bg-transparent border border-material-outline text-material-textSecondary rounded-full text-xs font-semibold hover:bg-material-surfaceVariant transition-colors">
            Cancel
          </button>
          <button onclick="executeGitSync()" class="flex-1 py-2.5 bg-material-primary text-material-onPrimary rounded-full text-xs font-bold hover:bg-[#c4d7ff] transition-colors shadow-md">
            Execute
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ADD / EDIT CLIENT MODAL -->
  <div id="client-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm overflow-y-auto">
    <div class="bg-material-surface w-full max-w-lg rounded-[28px] p-6 border border-material-outlineVariant/30 shadow-2xl max-h-[90vh] flex flex-col my-4">
      
      <!-- Modal Header -->
      <div class="flex justify-between items-center pb-3 border-b border-material-outlineVariant/20 shrink-0">
        <h3 id="client-modal-title" class="text-base font-bold text-material-text">Edit Client Details</h3>
        <button onclick="closeClientModal()" class="text-material-textMuted hover:text-material-text transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>
      </div>

      <!-- Modal Body (Form Fields) -->
      <form id="client-form" onsubmit="saveClientForm(event)" class="flex-grow overflow-y-auto space-y-4 py-4 pr-1 text-xs">
        <input type="hidden" id="form-client-id">
        
        <!-- Company & DM -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <div>
            <label class="block font-medium text-material-textSecondary mb-1">Company Name *</label>
            <input type="text" id="form-company" required class="w-full px-3 py-2 bg-material-bg border border-material-outlineVariant rounded-lg text-material-text focus:outline-none focus:border-material-primary">
          </div>
          <div>
            <label class="block font-medium text-material-textSecondary mb-1">Decision Maker (DM) *</label>
            <input type="text" id="form-dm" required class="w-full px-3 py-2 bg-material-bg border border-material-outlineVariant rounded-lg text-material-text focus:outline-none focus:border-material-primary">
          </div>
        </div>

        <!-- Location & Status -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <div>
            <label class="block font-medium text-material-textSecondary mb-1">Location *</label>
            <input type="text" id="form-location" required class="w-full px-3 py-2 bg-material-bg border border-material-outlineVariant rounded-lg text-material-text focus:outline-none focus:border-material-primary">
          </div>
          <div>
            <label class="block font-medium text-material-textSecondary mb-1">Pipeline Status</label>
            <select id="form-status" class="w-full px-3 py-2 bg-material-bg border border-material-outlineVariant rounded-lg text-material-text focus:outline-none focus:border-material-primary">
              <option value="Target Locked">Target Locked</option>
              <option value="Warm Contact">Warm Contact</option>
              <option value="Proposal Sent">Proposal Sent</option>
              <option value="Closed Won">Closed Won</option>
              <option value="Closed Lost">Closed Lost</option>
            </select>
          </div>
        </div>

        <!-- Links -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <div>
            <label class="block font-medium text-material-textSecondary mb-1">LinkedIn Contact</label>
            <input type="text" id="form-linkedin" placeholder="Active Profile or URL" class="w-full px-3 py-2 bg-material-bg border border-material-outlineVariant rounded-lg text-material-text focus:outline-none focus:border-material-primary">
          </div>
          <div>
            <label class="block font-medium text-material-textSecondary mb-1">Website / Domain</label>
            <input type="text" id="form-website" placeholder="domain.com" class="w-full px-3 py-2 bg-material-bg border border-material-outlineVariant rounded-lg text-material-text focus:outline-none focus:border-material-primary">
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <div>
            <label class="block font-medium text-material-textSecondary mb-1">Email Address</label>
            <input type="text" id="form-email" placeholder="contact@email.com" class="w-full px-3 py-2 bg-material-bg border border-material-outlineVariant rounded-lg text-material-text focus:outline-none focus:border-material-primary">
          </div>
          <div>
            <label class="block font-medium text-material-textSecondary mb-1">Phone / WhatsApp</label>
            <input type="text" id="form-phone" placeholder="Phone details" class="w-full px-3 py-2 bg-material-bg border border-material-outlineVariant rounded-lg text-material-text focus:outline-none focus:border-material-primary">
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <div>
            <label class="block font-medium text-material-textSecondary mb-1">Instagram / Socials</label>
            <input type="text" id="form-social" placeholder="@handle or tags" class="w-full px-3 py-2 bg-material-bg border border-material-outlineVariant rounded-lg text-material-text focus:outline-none focus:border-material-primary">
          </div>
          <div>
            <label class="block font-medium text-material-textSecondary mb-1">Client Response</label>
            <select id="form-response" class="w-full px-3 py-2 bg-material-bg border border-material-outlineVariant rounded-lg text-material-text focus:outline-none focus:border-material-primary">
              <option value="No">No</option>
              <option value="Yes">Yes</option>
            </select>
          </div>
        </div>

        <!-- Pitches & Remarks -->
        <div>
          <label class="block font-medium text-material-textSecondary mb-1">The "Trojan Horse" Pitch</label>
          <textarea id="form-pitch" rows="2" class="w-full px-3 py-2 bg-material-bg border border-material-outlineVariant rounded-lg text-material-text focus:outline-none focus:border-material-primary"></textarea>
        </div>

        <div>
          <label class="block font-medium text-material-textSecondary mb-1">Pain Points & Remarks</label>
          <textarea id="form-remarks" rows="2" placeholder="Enter key remarks, paint points, follow ups..." class="w-full px-3 py-2 bg-material-bg border border-material-outlineVariant rounded-lg text-material-text focus:outline-none focus:border-material-primary"></textarea>
        </div>

        <!-- CUSTOM FIELDS SECTION -->
        <div class="border-t border-material-outlineVariant/20 pt-4">
          <div class="flex justify-between items-center mb-3">
            <label class="block font-bold text-material-text text-sm">Custom Fields & Social Links</label>
            <button type="button" onclick="addCustomFieldRow('', '')" class="px-3 py-1 bg-material-primaryContainer text-material-onPrimaryContainer border border-material-primary/30 rounded-full text-[10px] font-bold hover:bg-material-surfaceVariant transition-colors">
              + Add Field
            </button>
          </div>
          <div id="custom-fields-container" class="space-y-2">
            <!-- Dynamic rows will be inserted here -->
          </div>
        </div>

        <!-- Form Footer -->
        <div class="flex gap-2 pt-3 border-t border-material-outlineVariant/20 shrink-0">
          <button type="button" id="delete-client-btn" onclick="deleteClient()" class="hidden px-4 py-2.5 bg-material-error/10 border border-material-error/30 text-material-error rounded-full font-bold hover:bg-material-error hover:text-material-onError transition-colors mr-auto">
            Delete
          </button>
          
          <button type="button" onclick="closeClientModal()" class="px-4 py-2.5 bg-transparent border border-material-outline text-material-textSecondary rounded-full font-semibold hover:bg-material-surfaceVariant transition-colors">
            Cancel
          </button>
          
          <button type="submit" class="px-5 py-2.5 bg-material-primary text-material-onPrimary rounded-full font-bold hover:bg-[#c4d7ff] transition-colors shadow-md">
            Save
          </button>
        </div>

      </form>
    </div>
  </div>

  <!-- Toast Feed container -->
  <div id="toast-container" class="fixed bottom-24 left-4 right-4 z-50 flex flex-col gap-2 max-w-sm mx-auto pointer-events-none"></div>

  <!-- App Script Logic -->
  <script>
    let clients = [];
    let originalClients = [];
    let currentFilter = 'All';
    let hasUnsavedChanges = false;

    // Load assets
    window.addEventListener('DOMContentLoaded', async () => {
      if ('serviceWorker' in navigator) {
        try {
          await navigator.serviceWorker.register('./sw.js');
        } catch (err) {
          console.warn('SW registration bypassed:', err.message);
        }
      }
      await loadData();
    });

    // PWA Install Event Handler
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const banner = document.getElementById('pwa-banner');
      if (banner) banner.classList.remove('hidden');
    });

    document.getElementById('pwa-install-btn')?.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        await deferredPrompt.userChoice;
        deferredPrompt = null;
        document.getElementById('pwa-banner')?.classList.add('hidden');
      }
    });

    // Database Load
    async function loadData() {
      const gitUrl = 'https://raw.githubusercontent.com/smdhussain06/trailwebsite/main/data.json';
      const localUrl = './data.json';
      
      showToast('Connecting to database...', 'info');
      
      try {
        const response = await fetch(gitUrl + '?t=' + new Date().getTime(), { cache: 'no-store' });
        if (!response.ok) throw new Error();
        clients = await response.json();
        originalClients = JSON.parse(JSON.stringify(clients));
        showToast('Synced with cloud database', 'success');
        updateSyncStatus(false);
      } catch (err) {
        try {
          const localResponse = await fetch(localUrl + '?t=' + new Date().getTime());
          if (!localResponse.ok) throw new Error();
          clients = await localResponse.json();
          originalClients = JSON.parse(JSON.stringify(clients));
          showToast('Loaded local database copy', 'info');
          updateSyncStatus(false);
        } catch (localErr) {
          showToast('Failed to load database. Check configurations.', 'error');
        }
      }
      renderDashboard();
    }

    function renderDashboard() {
      document.getElementById('stat-total').textContent = clients.length;
      document.getElementById('stat-locked').textContent = clients.filter(c => c.status === 'Target Locked').length;
      document.getElementById('stat-pitching').textContent = clients.filter(c => c.status === 'Warm Contact' || c.status === 'Proposal Sent').length;
      document.getElementById('stat-won').textContent = clients.filter(c => c.status === 'Closed Won').length;
      
      filterClients();
    }

    function setFilter(filter) {
      currentFilter = filter;
      const chips = document.querySelectorAll('.tab-chip');
      
      chips.forEach(chip => {
        const text = chip.textContent.trim().toLowerCase();
        let match = false;
        if (filter === 'All' && text === 'all') match = true;
        if (filter === 'Target Locked' && text === 'locked') match = true;
        if (filter === 'Warm Contact' && text === 'pitching') match = true;
        if (filter === 'Closed Won' && text === 'won') match = true;
        if (filter === 'Closed Lost' && text === 'lost') match = true;

        if (match) {
          chip.className = "tab-chip shrink-0 px-4 py-1.5 rounded-full text-xs font-medium border border-material-primary bg-material-primaryContainer text-material-onPrimaryContainer transition-colors";
        } else {
          chip.className = "tab-chip shrink-0 px-4 py-1.5 rounded-full text-xs font-medium border border-material-outline text-material-textSecondary hover:bg-material-surfaceVariant transition-colors";
        }
      });
      filterClients();
    }

    // SMART LINK GENERATORS (Clickable / Searchable)
    function getCompanyLink(company) {
      return `https://www.google.com/search?q=${encodeURIComponent(company)}`;
    }
    
    function getDmLink(dm, company) {
      return `https://www.linkedin.com/search/results/all/?keywords=${encodeURIComponent(dm + ' ' + company)}`;
    }

    function getLocationLink(location) {
      return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(location)}`;
    }

    function getLinkedinLink(dm, company, linkedin) {
      if (linkedin && linkedin.startsWith('http')) return linkedin;
      return `https://www.linkedin.com/search/results/all/?keywords=${encodeURIComponent(dm + ' ' + company)}`;
    }

    function getWebsiteLink(company, website) {
      if (!website || website.includes('[Needs Extraction]') || website.toLowerCase().includes('no website')) {
        return `https://www.google.com/search?q=${encodeURIComponent(company + " official website")}`;
      }
      const domain = website.split(' ')[0];
      return `http://${domain}`;
    }

    function getEmailLink(company, email) {
      if (!email || email.includes('[Needs Extraction]')) {
        return `https://www.google.com/search?q=${encodeURIComponent(company + " contact email address")}`;
      }
      const mailStr = email.split(' ')[0];
      return `mailto:${mailStr}`;
    }

    function getPhoneLink(company, phone) {
      if (!phone || phone.includes('[Needs Extraction]')) {
        return `https://www.google.com/search?q=${encodeURIComponent(company + " phone contact number")}`;
      }
      const numStr = phone.split(' ')[0];
      return `tel:${numStr}`;
    }

    function getSocialLink(company, social) {
      if (!social || social.includes('[Needs Extraction]')) {
        return `https://www.google.com/search?q=${encodeURIComponent(company + " Instagram Facebook")}`;
      }
      if (social.startsWith('@')) {
        return `https://instagram.com/${social.substring(1)}`;
      }
      if (social.toLowerCase().includes('ig') || social.toLowerCase().includes('instagram') || social.toLowerCase().includes('youtube')) {
        return `https://instagram.com/explore/tags/${encodeURIComponent(company.replace(/\s+/g, ''))}/`;
      }
      return `https://www.google.com/search?q=${encodeURIComponent(social)}`;
    }

    function getPitchLink(company, pitch) {
      return `https://www.google.com/search?q=${encodeURIComponent(company + " " + pitch)}`;
    }

    // Client filtering & render
    function filterClients() {
      const query = document.getElementById('search-input').value.toLowerCase().trim();
      const container = document.getElementById('clients-container');
      
      if (!container) return;
      container.innerHTML = '';

      const filtered = clients.filter(c => {
        // Filter by tab
        if (currentFilter !== 'All') {
          if (currentFilter === 'Warm Contact') {
            if (c.status !== 'Warm Contact' && c.status !== 'Proposal Sent') return false;
          } else {
            if (c.status !== currentFilter) return false;
          }
        }
        
        // Filter by search text
        if (query) {
          return c.company.toLowerCase().includes(query) || 
                 c.dm.toLowerCase().includes(query) || 
                 c.location.toLowerCase().includes(query) ||
                 c.pitch.toLowerCase().includes(query);
        }
        return true;
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="py-12 text-center text-material-textMuted text-xs">
            No matching leads in pipeline.
          </div>
        `;
        return;
      }

      // Render cards
      filtered.forEach(client => {
        const card = document.createElement('div');
        
        // Border colors based on status (M3 tonal styling)
        let borderClass = 'border-material-outlineVariant/30';
        if (client.status === 'Closed Won') borderClass = 'border-emerald-500/40 bg-emerald-950/5';
        if (client.status === 'Closed Lost') borderClass = 'border-rose-500/40 bg-rose-950/5';
        if (client.status === 'Warm Contact' || client.status === 'Proposal Sent') borderClass = 'border-indigo-500/45 bg-indigo-950/5';
        
        // Format link badge styles based on content (Dashed if Needs Extraction, Solid if Filled)
        const linkConfig = {
          website: getLinkChip(client.company, client.website, 'Website', 'getWebsiteLink'),
          linkedin: getLinkChip(client.company, client.linkedin, 'LinkedIn', 'getLinkedinLink', client.dm),
          email: getLinkChip(client.company, client.email, 'Email', 'getEmailLink'),
          phone: getLinkChip(client.company, client.phone, 'Phone/WA', 'getPhoneLink'),
          social: getLinkChip(client.company, client.social, 'Socials', 'getSocialLink')
        };

        // Render fully customizable links and topic texts
        let customChipsHtml = '';
        let customTextsHtml = '';
        
        if (client.customFields && client.customFields.length > 0) {
          client.customFields.forEach(field => {
            const val = field.value.trim();
            if (!val) return;
            
            // Check if it's a link (starts with http/https, mailto, tel, or has a domain layout)
            const isUrl = /^(https?:\/\/|mailto:|tel:|[a-zA-Z0-9.-]+\.[a-zA-Z]{2,})/i.test(val);
            
            if (isUrl) {
              let url = val;
              if (!/^(https?:|mailto:|tel:)/i.test(url)) {
                url = 'http://' + url;
              }
              customChipsHtml += `
                <a href="${url}" target="_blank" class="text-[10px] font-medium px-2 py-0.5 rounded-full border border-material-primary/45 bg-[#2b4470]/30 text-material-primary hover:bg-[#2b4470]/60 transition-colors flex items-center gap-1">
                  ✓ ${field.title}
                </a>
              `;
            } else {
              customTextsHtml += `
                <div class="bg-material-bg/30 rounded-xl p-2.5 border border-material-outlineVariant/5">
                  <span class="block text-[8px] font-bold text-material-textMuted uppercase tracking-wider mb-0.5">${field.title}</span>
                  <p class="text-xs text-material-textSecondary leading-relaxed">${field.value}</p>
                </div>
              `;
            }
          });
        }

        card.className = `bg-material-surface border ${borderClass} rounded-[24px] p-5 flex flex-col gap-3 transition-all relative overflow-hidden`;
        
        card.innerHTML = `
          <!-- Header (Company & Location & Edit Button) -->
          <div class="flex justify-between items-start gap-2">
            <div class="min-w-0 flex-grow">
              <a href="${getCompanyLink(client.company)}" target="_blank" class="text-base font-bold text-material-text hover:text-material-primary transition-colors flex items-center gap-1.5">
                <span class="truncate">${client.company}</span>
                <svg class="w-3.5 h-3.5 text-material-primary shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
                </svg>
              </a>
              <div class="text-xs text-material-textMuted mt-1">
                DM: <a href="${getDmLink(client.dm, client.company)}" target="_blank" class="m3-link font-medium hover:underline">${client.dm}</a>
              </div>
            </div>
            
            <div class="flex items-center gap-1 shrink-0">
              <!-- Edit Icon Button -->
              <button onclick="openClientModal(${client.id})" class="p-1.5 text-material-textMuted hover:text-material-primary rounded-full hover:bg-material-surfaceVariant transition-colors">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path>
                </svg>
              </button>
              
              <!-- Location Tag -->
              <a href="${getLocationLink(client.location)}" target="_blank" class="text-[9px] font-semibold px-2 py-0.5 rounded-full border border-material-outlineVariant bg-material-surfaceVariant text-material-textSecondary hover:border-material-primary transition-all flex items-center gap-0.5">
                ${client.location}
              </a>
            </div>
          </div>

          <!-- Clickable Action Chips Grid -->
          <div class="flex flex-wrap gap-1.5 py-1">
            ${linkConfig.website}
            ${linkConfig.linkedin}
            ${linkConfig.email}
            ${linkConfig.phone}
            ${linkConfig.social}
            ${customChipsHtml}
          </div>

          <!-- Pitch & Remarks -->
          <div class="space-y-2 mt-1">
            <!-- Pitch -->
            <div class="bg-material-surfaceVariant/45 rounded-xl p-2.5 border border-material-outlineVariant/10">
              <span class="block text-[8px] font-bold text-material-textMuted uppercase tracking-wider mb-0.5">The "Trojan Horse" Pitch</span>
              <a href="${getPitchLink(client.company, client.pitch)}" target="_blank" class="text-xs text-material-textSecondary hover:text-material-primary leading-relaxed block hover:underline">
                &ldquo;${client.pitch}&rdquo;
              </a>
            </div>
            
            <!-- Remarks / Pain Points -->
            ${client.remarks ? `
            <div class="bg-material-bg/40 rounded-xl p-2.5 border border-material-outlineVariant/5">
              <span class="block text-[8px] font-bold text-material-textMuted uppercase tracking-wider mb-0.5">Pain Points & Remarks</span>
              <p class="text-xs text-material-textMuted leading-relaxed">${client.remarks}</p>
            </div>
            ` : ''}
            
            <!-- Custom Texts / Topic based fields -->
            ${customTextsHtml}
          </div>

          <!-- Status Select and Response Toggle Footer -->
          <div class="flex items-center justify-between gap-3 pt-1 border-t border-material-outlineVariant/10">
            <div class="flex-grow max-w-[150px]">
              <select onchange="updateClientField(${client.id}, 'status', this.value)" class="w-full appearance-none bg-material-surface border border-material-outline rounded-full px-3 py-1 text-xs text-material-textSecondary font-medium focus:outline-none focus:border-material-primary cursor-pointer">
                <option value="Target Locked" ${client.status === 'Target Locked' ? 'selected' : ''}>Target Locked</option>
                <option value="Warm Contact" ${client.status === 'Warm Contact' ? 'selected' : ''}>Warm Contact</option>
                <option value="Proposal Sent" ${client.status === 'Proposal Sent' ? 'selected' : ''}>Proposal Sent</option>
                <option value="Closed Won" ${client.status === 'Closed Won' ? 'selected' : ''}>Closed Won</option>
                <option value="Closed Lost" ${client.status === 'Closed Lost' ? 'selected' : ''}>Closed Lost</option>
              </select>
            </div>
            
            <button onclick="toggleResponse(${client.id})" class="flex items-center gap-1 px-3 py-1 rounded-full text-xs font-semibold border transition-all ${client.response === 'Yes' ? 'bg-emerald-500/10 border-emerald-500/50 text-emerald-400' : 'bg-transparent border-material-outline text-material-textSecondary'}">
              <span>Resp:</span>
              <span>${client.response === 'Yes' ? 'Yes' : 'No'}</span>
            </button>
          </div>
        `;
        
        container.appendChild(card);
      });
    }

    // Dynamic Pill Chip builder
    function getLinkChip(company, value, label, linkFunc, dmValue = '') {
      const needsExtraction = !value || value.includes('[Needs Extraction]') || value.toLowerCase().includes('no website') || value.toLowerCase().includes('no digital');
      
      const link = window[linkFunc](dmValue || company, company, value);
      
      if (needsExtraction) {
        return `
          <a href="${link}" target="_blank" class="text-[10px] font-medium px-2 py-0.5 rounded-full border border-dashed border-material-error/40 bg-material-error/5 text-material-error hover:bg-material-error/10 transition-colors flex items-center gap-1">
            🔍 Find ${label}
          </a>
        `;
      } else {
        return `
          <a href="${link}" target="_blank" class="text-[10px] font-medium px-2 py-0.5 rounded-full border border-material-primary/40 bg-material-primaryContainer/20 text-material-primary hover:bg-material-primaryContainer/40 transition-colors flex items-center gap-1">
            ✓ ${label}
          </a>
        `;
      }
    }

    // Dynamic row addition for edit modal
    function addCustomFieldRow(title = '', value = '') {
      const container = document.getElementById('custom-fields-container');
      if (!container) return;
      
      const rowId = 'row-' + Date.now() + Math.random().toString(36).substr(2, 5);
      const row = document.createElement('div');
      row.className = 'custom-field-row flex items-center gap-2 border-b border-material-outlineVariant/10 pb-2';
      row.id = rowId;
      
      row.innerHTML = `
        <input type="text" placeholder="Title (e.g. YouTube)" value="${title}" class="custom-field-title w-1/3 px-2 py-1.5 bg-material-bg border border-material-outlineVariant rounded text-xs text-material-text focus:outline-none focus:border-material-primary">
        <input type="text" placeholder="Link/Text Remarks..." value="${value}" class="custom-field-value w-7/12 px-2 py-1.5 bg-material-bg border border-material-outlineVariant rounded text-xs text-material-text focus:outline-none focus:border-material-primary">
        <button type="button" onclick="document.getElementById('${rowId}').remove()" class="w-1/12 text-material-error hover:text-[#ffdad6] font-bold text-center text-sm">
          ×
        </button>
      `;
      
      container.appendChild(row);
    }

    // Toggle Response
    function toggleResponse(id) {
      const idx = clients.findIndex(c => c.id === id);
      if (idx === -1) return;
      const newResponse = clients[idx].response === 'Yes' ? 'No' : 'Yes';
      updateClientField(id, 'response', newResponse);
      showToast(`${clients[idx].company} response changed to: ${newResponse}`, 'info');
    }

    // Update Local Data state
    function updateClientField(id, field, value) {
      const idx = clients.findIndex(c => c.id === id);
      if (idx === -1) return;
      clients[idx][field] = value;
      checkUnsavedChangesState();
      renderDashboard();
    }

    // Verify git diff state
    function checkUnsavedChangesState() {
      hasUnsavedChanges = JSON.stringify(clients) !== JSON.stringify(originalClients);
      updateSyncStatus(hasUnsavedChanges);
    }

    function updateSyncStatus(unsaved) {
      const badge = document.getElementById('sync-badge');
      const saveBtn = document.getElementById('save-btn');
      
      if (unsaved) {
        badge?.classList.remove('hidden');
        if (saveBtn) {
          saveBtn.className = "fixed bottom-6 right-6 flex items-center justify-center gap-2 bg-[#ffb4ab] hover:bg-[#ffdad6] text-[#690005] font-semibold py-4.5 px-5 rounded-[16px] shadow-lg transition-transform hover:scale-105 active:scale-95 animate-bounce z-40";
        }
      } else {
        badge?.classList.add('hidden');
        if (saveBtn) {
          saveBtn.className = "fixed bottom-6 right-6 flex items-center justify-center gap-2 bg-[#a8c7fa] hover:bg-[#c4d7ff] text-[#062e6f] font-semibold py-4.5 px-5 rounded-[16px] shadow-lg transition-transform hover:scale-105 active:scale-95 z-40";
        }
      }
    }

    // OPEN ADD / EDIT LEAD MODAL
    function openClientModal(id) {
      const title = document.getElementById('client-modal-title');
      const deleteBtn = document.getElementById('delete-client-btn');
      const form = document.getElementById('client-form');
      const fieldsContainer = document.getElementById('custom-fields-container');
      
      if (!title || !form || !fieldsContainer) return;
      
      form.reset();
      fieldsContainer.innerHTML = '';
      
      if (id === null) {
        title.textContent = 'Add New Target';
        document.getElementById('form-client-id').value = '';
        if (deleteBtn) deleteBtn.classList.add('hidden');
        
        document.getElementById('form-status').value = 'Target Locked';
        document.getElementById('form-response').value = 'No';
      } else {
        const client = clients.find(c => c.id === id);
        if (!client) return;
        
        title.textContent = 'Edit Client Record';
        document.getElementById('form-client-id').value = client.id;
        document.getElementById('form-company').value = client.company || '';
        document.getElementById('form-dm').value = client.dm || '';
        document.getElementById('form-location').value = client.location || '';
        document.getElementById('form-status').value = client.status || 'Target Locked';
        document.getElementById('form-linkedin').value = client.linkedin || '';
        document.getElementById('form-website').value = client.website || '';
        document.getElementById('form-email').value = client.email || '';
        document.getElementById('form-phone').value = client.phone || '';
        document.getElementById('form-social').value = client.social || '';
        document.getElementById('form-response').value = client.response || 'No';
        document.getElementById('form-pitch').value = client.pitch || '';
        document.getElementById('form-remarks').value = client.remarks || '';
        
        // Load custom fields
        if (client.customFields && client.customFields.length > 0) {
          client.customFields.forEach(f => {
            addCustomFieldRow(f.title, f.value);
          });
        }
        
        if (deleteBtn) deleteBtn.classList.remove('hidden');
      }
      
      document.getElementById('client-modal')?.classList.remove('hidden');
    }

    function closeClientModal() {
      document.getElementById('client-modal')?.classList.add('hidden');
    }

    // SAVE CLIENT FORM ACTION
    function saveClientForm(e) {
      e.preventDefault();
      
      const idVal = document.getElementById('form-client-id').value;
      const companyVal = document.getElementById('form-company').value.trim();
      const dmVal = document.getElementById('form-dm').value.trim();
      const locationVal = document.getElementById('form-location').value.trim();
      const statusVal = document.getElementById('form-status').value;
      const linkedinVal = document.getElementById('form-linkedin').value.trim() || '[Needs Extraction]';
      const websiteVal = document.getElementById('form-website').value.trim() || '[Needs Extraction]';
      const emailVal = document.getElementById('form-email').value.trim() || '[Needs Extraction]';
      const phoneVal = document.getElementById('form-phone').value.trim() || '[Needs Extraction]';
      const socialVal = document.getElementById('form-social').value.trim() || '[Needs Extraction]';
      const responseVal = document.getElementById('form-response').value;
      const pitchVal = document.getElementById('form-pitch').value.trim();
      const remarksVal = document.getElementById('form-remarks').value.trim();
      
      // Extract custom fields values
      const customFieldRows = document.querySelectorAll('.custom-field-row');
      const customFields = [];
      customFieldRows.forEach(row => {
        const title = row.querySelector('.custom-field-title').value.trim();
        const value = row.querySelector('.custom-field-value').value.trim();
        if (title) {
          customFields.push({ title, value });
        }
      });
      
      if (!companyVal || !dmVal || !locationVal) {
        showToast('Required fields are missing', 'error');
        return;
      }
      
      if (idVal === '') {
        const newClient = {
          id: Date.now(),
          company: companyVal,
          dm: dmVal,
          location: locationVal,
          status: statusVal,
          linkedin: linkedinVal,
          website: websiteVal,
          email: emailVal,
          phone: phoneVal,
          social: socialVal,
          response: responseVal,
          pitch: pitchVal,
          remarks: remarksVal,
          customFields: customFields
        };
        clients.push(newClient);
        showToast(`Added ${companyVal} to pipeline`, 'success');
      } else {
        const targetId = parseInt(idVal);
        const idx = clients.findIndex(c => c.id === targetId);
        if (idx !== -1) {
          clients[idx].company = companyVal;
          clients[idx].dm = dmVal;
          clients[idx].location = locationVal;
          clients[idx].status = statusVal;
          clients[idx].linkedin = linkedinVal;
          clients[idx].website = websiteVal;
          clients[idx].email = emailVal;
          clients[idx].phone = phoneVal;
          clients[idx].social = socialVal;
          clients[idx].response = responseVal;
          clients[idx].pitch = pitchVal;
          clients[idx].remarks = remarksVal;
          clients[idx].customFields = customFields;
          showToast(`Updated details for ${companyVal}`, 'success');
        }
      }
      
      closeClientModal();
      checkUnsavedChangesState();
      renderDashboard();
    }

    // DELETE CLIENT
    function deleteClient() {
      const idVal = document.getElementById('form-client-id').value;
      if (idVal === '') return;
      
      const targetId = parseInt(idVal);
      const client = clients.find(c => c.id === targetId);
      if (!client) return;
      
      if (confirm(`Are you sure you want to delete ${client.company} from the CRM?`)) {
        clients = clients.filter(c => c.id !== targetId);
        showToast(`Removed ${client.company}`, 'warning');
        closeClientModal();
        checkUnsavedChangesState();
        renderDashboard();
      }
    }

    // Authentication modal visibility controls
    function openAuthModal() {
      document.getElementById('auth-modal')?.classList.remove('hidden');
      const input = document.getElementById('pat-input');
      if (input) {
        input.value = '';
        input.focus();
      }
    }

    function closeAuthModal() {
      document.getElementById('auth-modal')?.classList.add('hidden');
      const input = document.getElementById('pat-input');
      if (input) input.value = '';
    }

    // M3 Notification Toast
    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;

      const toast = document.createElement('div');
      toast.className = 'p-3 rounded-[12px] shadow-xl text-xs font-semibold text-center border pointer-events-auto transition-opacity duration-300';
      
      if (type === 'success') {
        toast.className += ' bg-[#0f2d1e] border-emerald-500/40 text-emerald-300';
      } else if (type === 'error') {
        toast.className += ' bg-[#3b0b0f] border-rose-500/40 text-rose-300';
      } else if (type === 'warning') {
        toast.className += ' bg-[#3a2205] border-amber-500/40 text-amber-300';
      } else {
        toast.className += ' bg-[#1a1c22] border-material-outlineVariant text-material-textSecondary';
      }

      toast.textContent = message;
      container.appendChild(toast);

      setTimeout(() => {
        toast.classList.add('opacity-0');
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    // Safe base64
    function encodeBase64(str) {
      return btoa(unescape(encodeURIComponent(str)));
    }

    // REST API PUSH
    async function executeGitSync() {
      const patInput = document.getElementById('pat-input');
      let token = patInput ? patInput.value.trim() : '';

      if (!token) {
        showToast('Valid GitHub token is required.', 'error');
        return;
      }

      closeAuthModal();
      showToast('Contacting GitHub...', 'info');

      const url = 'https://api.github.com/repos/smdhussain06/trailwebsite/contents/data.json';
      let sha = null;

      try {
        const getResponse = await fetch(url, {
          method: 'GET',
          headers: {
            'Authorization': `token ${token}`,
            'Accept': 'application/vnd.github.v3+json',
            'Cache-Control': 'no-cache'
          }
        });

        if (getResponse.status === 401) {
          throw new Error('Unauthorized (401). Check if your token is correct.');
        } else if (getResponse.status === 403) {
          throw new Error('Forbidden (403). Rate limit exceeded or token lacks scopes.');
        } else if (getResponse.ok) {
          const contents = await getResponse.json();
          sha = contents.sha;
        } else if (getResponse.status !== 404) {
          throw new Error(`API Error: ${getResponse.statusText} (${getResponse.status})`);
        }

        const putBody = {
          message: 'Update client records via Material CRM',
          content: encodeBase64(JSON.stringify(clients, null, 2))
        };
        if (sha) putBody.sha = sha;

        const putResponse = await fetch(url, {
          method: 'PUT',
          headers: {
            'Authorization': `token ${token}`,
            'Accept': 'application/vnd.github.v3+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(putBody)
        });

        if (putResponse.status === 401) {
          throw new Error('Write Unauthorized (401). Check token scopes.');
        } else if (putResponse.status === 403) {
          throw new Error('Write Forbidden (403). Ensure token has "repo" (write) scope.');
        } else if (!putResponse.ok) {
          throw new Error(`Write Failed: ${putResponse.statusText} (${putResponse.status})`);
        }

        originalClients = JSON.parse(JSON.stringify(clients));
        hasUnsavedChanges = false;
        updateSyncStatus(false);
        showToast('Sync successful!', 'success');
      } catch (err) {
        console.error('Sync failed:', err);
        showToast('Sync failed: ' + err.message, 'error');
      } finally {
        token = '';
        if (patInput) patInput.value = '';
      }
    }
  </script>
</body>
</html>
