<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sniper CRM</title>
  
  <!-- SEO & Mobile Config -->
  <meta name="description" content="Minimalist Material Design 3 Git-Backed CRM for high-ticket sales.">
  <meta name="theme-color" content="#111318">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="logo.jpg">
  
  <!-- Google Fonts (Roboto & Product Sans proxy) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'Roboto', 'sans-serif'],
          },
          colors: {
            material: {
              bg: '#111318',
              surface: '#1b1b1f',
              surfaceVariant: '#232429',
              primary: '#a8c7fa', // Classic Google Blue accent
              onPrimary: '#062e6f',
              primaryContainer: '#2b4470',
              onPrimaryContainer: '#d6e2ff',
              secondary: '#c2c6dc',
              secondaryContainer: '#2b2e3b',
              error: '#ffb4ab',
              outline: '#8e9099',
              outlineVariant: '#44474e',
              text: '#e3e2e6',
              textSecondary: '#c5c6d0',
              textMuted: '#90949f',
            }
          }
        }
      }
    }
  </script>

  <style>
    /* Prevent default tap highlight colors on mobile browsers */
    * {
      -webkit-tap-highlight-color: transparent;
    }
    
    /* Elegant Material 3 Style Scrollbars */
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-track {
      background: #111318;
    }
    ::-webkit-scrollbar-thumb {
      background: #44474e;
      border-radius: 999px;
    }
    
    /* Horizontal scrolling chips list helper */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Outlined link styling */
    .m3-link {
      color: #a8c7fa;
      transition: color 0.15s ease, text-decoration-color 0.15s ease;
      word-break: break-all;
    }
    .m3-link:hover {
      color: #c4d7ff;
      text-decoration: underline;
    }
  </style>
</head>
<body class="bg-material-bg text-material-text min-h-screen font-sans flex flex-col antialiased">

  <!-- Top App Search Bar (Google App Style) -->
  <header class="sticky top-0 z-40 bg-material-bg/95 backdrop-blur-md px-4 py-3 border-b border-material-outlineVariant/20 flex flex-col gap-2">
    <div class="flex items-center gap-3 bg-material-surfaceVariant px-4 py-3 rounded-full border border-material-outlineVariant/30 shadow-md">
      <!-- App Scope Target Logo -->
      <div class="w-7 h-7 flex items-center justify-center border border-material-primary/60 rounded-full bg-material-primary/10">
        <span class="w-1.5 h-1.5 bg-material-primary rounded-full"></span>
      </div>
      
      <!-- Live Search Input -->
      <input type="text" id="search-input" oninput="filterClients()" placeholder="Search targets, location, DM..." class="flex-grow bg-transparent text-sm text-material-text placeholder-material-textMuted focus:outline-none">
      
      <!-- Sync Status Badge -->
      <div id="sync-badge" class="hidden text-[10px] font-medium tracking-wide uppercase px-2 py-0.5 rounded bg-amber-500/10 text-amber-400 border border-amber-500/20">
        Unsaved
      </div>
    </div>

    <!-- M3 Filter Chips (Horizontal Scroll Box) -->
    <div class="flex items-center gap-2 overflow-x-auto no-scrollbar py-1">
      <button onclick="setFilter('All')" class="tab-chip shrink-0 px-4 py-1.5 rounded-full text-xs font-medium border border-material-primary bg-material-primaryContainer text-material-onPrimaryContainer transition-colors">
        All
      </button>
      <button onclick="setFilter('Target Locked')" class="tab-chip shrink-0 px-4 py-1.5 rounded-full text-xs font-medium border border-material-outline text-material-textSecondary hover:bg-material-surfaceVariant transition-colors">
        Locked
      </button>
      <button onclick="setFilter('Warm Contact')" class="tab-chip shrink-0 px-4 py-1.5 rounded-full text-xs font-medium border border-material-outline text-material-textSecondary hover:bg-material-surfaceVariant transition-colors">
        Pitching
      </button>
      <button onclick="setFilter('Closed Won')" class="tab-chip shrink-0 px-4 py-1.5 rounded-full text-xs font-medium border border-material-outline text-material-textSecondary hover:bg-material-surfaceVariant transition-colors">
        Won
      </button>
      <button onclick="setFilter('Closed Lost')" class="tab-chip shrink-0 px-4 py-1.5 rounded-full text-xs font-medium border border-material-outline text-material-textSecondary hover:bg-material-surfaceVariant transition-colors">
        Lost
      </button>
    </div>
  </header>

  <!-- Metrics Summary Block -->
  <section class="px-4 py-2 mt-2">
    <div class="flex items-center justify-between text-xs text-material-textMuted font-mono border-b border-material-outlineVariant/10 pb-2">
      <div>PIPELINE: <span id="stat-total" class="text-material-primary font-bold">0</span></div>
      <div class="flex gap-3">
        <div>LKD: <span id="stat-locked" class="text-amber-400">0</span></div>
        <div>PCH: <span id="stat-pitching" class="text-indigo-300">0</span></div>
        <div>WON: <span id="stat-won" class="text-emerald-400">0</span></div>
      </div>
    </div>
  </section>

  <!-- Clients Container -->
  <main class="flex-grow px-4 py-4 max-w-2xl mx-auto w-full pb-28">
    <div id="clients-container" class="flex flex-col gap-4">
      <!-- Loading Placeholder -->
      <div class="bg-material-surface border border-material-outlineVariant/20 rounded-[28px] p-5 animate-pulse flex flex-col gap-4">
        <div class="h-6 bg-material-surfaceVariant rounded w-3/4"></div>
        <div class="h-4 bg-material-surfaceVariant rounded w-1/2"></div>
        <div class="h-20 bg-material-surfaceVariant rounded"></div>
      </div>
    </div>
  </main>

  <!-- PWA Install Banner -->
  <div id="pwa-banner" class="hidden fixed bottom-24 left-4 right-4 bg-material-surface border border-material-outlineVariant/40 rounded-[20px] p-3 shadow-2xl z-40 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <img src="logo.jpg" alt="Logo" class="w-8 h-8 rounded-lg">
      <div class="text-xs">
        <p class="font-bold text-material-text">Install PWA App</p>
        <p class="text-material-textMuted text-[10px]">Access pipeline offline</p>
      </div>
    </div>
    <button id="pwa-install-btn" class="px-3 py-1 bg-material-primary text-material-onPrimary rounded-full text-xs font-bold transition-colors">Install</button>
  </div>

  <!-- Bottom Floating Action Button (M3 FAB) -->
  <button id="save-btn" onclick="openAuthModal()" class="fixed bottom-6 right-6 flex items-center justify-center gap-2 bg-[#a8c7fa] hover:bg-[#c4d7ff] text-[#062e6f] font-semibold py-4 px-5 rounded-[16px] shadow-lg transition-transform hover:scale-105 active:scale-95 z-40">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2".5 d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path>
    </svg>
    <span class="text-sm tracking-wide">Save to Git</span>
  </button>

  <!-- On-Demand GitHub Authentication Modal -->
  <div id="auth-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
    <div class="bg-material-surface w-full max-w-sm rounded-[28px] p-6 border border-material-outlineVariant/30 shadow-2xl relative">
      <button onclick="closeAuthModal()" class="absolute top-4 right-4 text-material-textMuted hover:text-material-text transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>

      <div class="text-center mb-5">
        <h3 class="text-lg font-bold text-material-text">Enter GitHub PAT to Commit</h3>
        <p class="text-xs text-material-textMuted mt-1">Authenticate to save changes back to your repository</p>
      </div>

      <div class="space-y-4">
        <input type="password" id="pat-input" placeholder="ghp_..." autocomplete="off" class="w-full px-4 py-3 rounded-xl text-sm bg-material-bg border border-material-outlineVariant text-material-text focus:outline-none focus:border-material-primary font-mono">
        
        <div class="flex gap-2">
          <button onclick="closeAuthModal()" class="flex-1 py-2.5 bg-transparent border border-material-outline text-material-textSecondary rounded-full text-xs font-semibold hover:bg-material-surfaceVariant transition-colors">
            Cancel
          </button>
          <button onclick="executeGitSync()" class="flex-1 py-2.5 bg-material-primary text-material-onPrimary rounded-full text-xs font-bold hover:bg-[#c4d7ff] transition-colors shadow-md">
            Execute
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Notification System -->
  <div id="toast-container" class="fixed bottom-24 left-4 right-4 z-50 flex flex-col gap-2 max-w-sm mx-auto pointer-events-none"></div>

  <!-- Main JavaScript App Logic -->
  <script>
    let clients = [];
    let originalClients = [];
    let currentFilter = 'All';
    let hasUnsavedChanges = false;

    // Load remote/local content on startup
    window.addEventListener('DOMContentLoaded', async () => {
      if ('serviceWorker' in navigator) {
        try {
          await navigator.serviceWorker.register('./sw.js');
        } catch (err) {
          console.warn('SW registration bypassed:', err.message);
        }
      }
      await loadData();
    });

    // PWA Prompt
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const banner = document.getElementById('pwa-banner');
      if (banner) banner.classList.remove('hidden');
    });

    document.getElementById('pwa-install-btn')?.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        await deferredPrompt.userChoice;
        deferredPrompt = null;
        document.getElementById('pwa-banner')?.classList.add('hidden');
      }
    });

    // Database Load Strategy
    async function loadData() {
      const gitUrl = 'https://raw.githubusercontent.com/smdhussain06/trailwebsite/main/data.json';
      const localUrl = './data.json';
      
      showToast('Connecting to database...', 'info');
      
      try {
        const response = await fetch(gitUrl + '?t=' + new Date().getTime(), { cache: 'no-store' });
        if (!response.ok) throw new Error();
        clients = await response.json();
        originalClients = JSON.parse(JSON.stringify(clients));
        showToast('Synced with cloud database', 'success');
        updateSyncStatus(false);
      } catch (err) {
        try {
          const localResponse = await fetch(localUrl + '?t=' + new Date().getTime());
          if (!localResponse.ok) throw new Error();
          clients = await localResponse.json();
          originalClients = JSON.parse(JSON.stringify(clients));
          showToast('Loaded local database copy', 'info');
          updateSyncStatus(false);
        } catch (localErr) {
          showToast('Failed to load database. Check configurations.', 'error');
        }
      }
      renderDashboard();
    }

    // Update numbers and display cards
    function renderDashboard() {
      document.getElementById('stat-total').textContent = clients.length;
      document.getElementById('stat-locked').textContent = clients.filter(c => c.status === 'Target Locked').length;
      document.getElementById('stat-pitching').textContent = clients.filter(c => c.status === 'Warm Contact' || c.status === 'Proposal Sent').length;
      document.getElementById('stat-won').textContent = clients.filter(c => c.status === 'Closed Won').length;
      
      filterClients();
    }

    // Set active category filter chip
    function setFilter(filter) {
      currentFilter = filter;
      const chips = document.querySelectorAll('.tab-chip');
      
      chips.forEach(chip => {
        const text = chip.textContent.trim().toLowerCase();
        let match = false;
        if (filter === 'All' && text === 'all') match = true;
        if (filter === 'Target Locked' && text === 'locked') match = true;
        if (filter === 'Warm Contact' && text === 'pitching') match = true;
        if (filter === 'Closed Won' && text === 'won') match = true;
        if (filter === 'Closed Lost' && text === 'lost') match = true;

        if (match) {
          chip.className = "tab-chip shrink-0 px-4 py-1.5 rounded-full text-xs font-medium border border-material-primary bg-material-primaryContainer text-material-onPrimaryContainer transition-colors";
        } else {
          chip.className = "tab-chip shrink-0 px-4 py-1.5 rounded-full text-xs font-medium border border-material-outline text-material-textSecondary hover:bg-material-surfaceVariant transition-colors";
        }
      });
      filterClients();
    }

    // SMART LINK GENERATORS (Clickable / Searchable)
    function getCompanyLink(company) {
      return `https://www.google.com/search?q=${encodeURIComponent(company)}`;
    }
    
    function getDmLink(dm, company) {
      return `https://www.linkedin.com/search/results/all/?keywords=${encodeURIComponent(dm + ' ' + company)}`;
    }

    function getLocationLink(location) {
      return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(location)}`;
    }

    function getLinkedinLink(dm, company, linkedin) {
      if (linkedin && linkedin.startsWith('http')) return linkedin;
      return `https://www.linkedin.com/search/results/all/?keywords=${encodeURIComponent(dm + ' ' + company)}`;
    }

    function getWebsiteLink(company, website) {
      if (!website || website.includes('[Needs Extraction]') || website.toLowerCase().includes('no website')) {
        return `https://www.google.com/search?q=${encodeURIComponent(company + " official website")}`;
      }
      const domain = website.split(' ')[0];
      return `http://${domain}`;
    }

    function getEmailLink(company, email) {
      if (!email || email.includes('[Needs Extraction]')) {
        return `https://www.google.com/search?q=${encodeURIComponent(company + " contact email address")}`;
      }
      const mailStr = email.split(' ')[0];
      return `mailto:${mailStr}`;
    }

    function getPhoneLink(company, phone) {
      if (!phone || phone.includes('[Needs Extraction]')) {
        return `https://www.google.com/search?q=${encodeURIComponent(company + " phone contact number")}`;
      }
      const numStr = phone.split(' ')[0];
      return `tel:${numStr}`;
    }

    function getSocialLink(company, social) {
      if (!social || social.includes('[Needs Extraction]')) {
        return `https://www.google.com/search?q=${encodeURIComponent(company + " Instagram Facebook")}`;
      }
      if (social.startsWith('@')) {
        return `https://instagram.com/${social.substring(1)}`;
      }
      if (social.toLowerCase().includes('ig') || social.toLowerCase().includes('instagram') || social.toLowerCase().includes('youtube')) {
        return `https://instagram.com/explore/tags/${encodeURIComponent(company.replace(/\s+/g, ''))}/`;
      }
      return `https://www.google.com/search?q=${encodeURIComponent(social)}`;
    }

    function getPitchLink(company, pitch) {
      return `https://www.google.com/search?q=${encodeURIComponent(company + " " + pitch)}`;
    }

    // Client filtering & render
    function filterClients() {
      const query = document.getElementById('search-input').value.toLowerCase().trim();
      const container = document.getElementById('clients-container');
      
      if (!container) return;
      container.innerHTML = '';

      const filtered = clients.filter(c => {
        // Filter by tab
        if (currentFilter !== 'All') {
          if (currentFilter === 'Warm Contact') {
            if (c.status !== 'Warm Contact' && c.status !== 'Proposal Sent') return false;
          } else {
            if (c.status !== currentFilter) return false;
          }
        }
        
        // Filter by search text
        if (query) {
          return c.company.toLowerCase().includes(query) || 
                 c.dm.toLowerCase().includes(query) || 
                 c.location.toLowerCase().includes(query) ||
                 c.pitch.toLowerCase().includes(query);
        }
        return true;
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="py-12 text-center text-material-textMuted text-xs">
            No matching leads in pipeline.
          </div>
        `;
        return;
      }

      // Render minimal cards
      filtered.forEach(client => {
        const card = document.createElement('div');
        
        // Border colors based on status (M3 tonal styling)
        let borderClass = 'border-material-outlineVariant/30';
        if (client.status === 'Closed Won') borderClass = 'border-emerald-500/30 bg-emerald-950/5';
        if (client.status === 'Closed Lost') borderClass = 'border-rose-500/30 bg-rose-950/5';
        if (client.status === 'Warm Contact' || client.status === 'Proposal Sent') borderClass = 'border-indigo-500/30 bg-indigo-950/5';
        
        card.className = `bg-material-surface border ${borderClass} rounded-[28px] p-5 flex flex-col gap-3.5 transition-all`;
        
        // Render detailed client fields
        card.innerHTML = `
          <!-- Header (Company & Location) -->
          <div class="flex justify-between items-start gap-2">
            <div>
              <a href="${getCompanyLink(client.company)}" target="_blank" class="text-base font-bold text-material-text hover:text-material-primary transition-colors flex items-center gap-1.5">
                ${client.company}
                <svg class="w-3 h-3 text-material-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
                </svg>
              </a>
              <div class="text-xs text-material-textMuted mt-1">
                DM: <a href="${getDmLink(client.dm, client.company)}" target="_blank" class="m3-link font-medium">${client.dm}</a>
              </div>
            </div>
            <a href="${getLocationLink(client.location)}" target="_blank" class="shrink-0 text-[10px] font-semibold px-2.5 py-0.5 rounded-full border border-material-outlineVariant bg-material-surfaceVariant text-material-textSecondary hover:border-material-primary transition-all flex items-center gap-1">
              <svg class="w-2.5 h-2.5 text-material-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
              </svg>
              ${client.location}
            </a>
          </div>

          <!-- Clickable Detail Fields (Grid Layout) -->
          <div class="grid grid-cols-2 gap-x-4 gap-y-2 py-2 border-y border-material-outlineVariant/10 text-xs">
            <!-- LinkedIn -->
            <div class="flex flex-col gap-0.5">
              <span class="text-[9px] font-bold text-material-textMuted uppercase tracking-wider">LinkedIn</span>
              <a href="${getLinkedinLink(client.dm, client.company, client.linkedin)}" target="_blank" class="m3-link truncate">
                ${client.linkedin}
              </a>
            </div>
            <!-- Website -->
            <div class="flex flex-col gap-0.5">
              <span class="text-[9px] font-bold text-material-textMuted uppercase tracking-wider">Website</span>
              <a href="${getWebsiteLink(client.company, client.website)}" target="_blank" class="m3-link truncate">
                ${client.website}
              </a>
            </div>
            <!-- Email -->
            <div class="flex flex-col gap-0.5">
              <span class="text-[9px] font-bold text-material-textMuted uppercase tracking-wider">Email</span>
              <a href="${getEmailLink(client.company, client.email)}" target="_blank" class="m3-link truncate">
                ${client.email}
              </a>
            </div>
            <!-- Phone/WhatsApp -->
            <div class="flex flex-col gap-0.5">
              <span class="text-[9px] font-bold text-material-textMuted uppercase tracking-wider">Phone / WhatsApp</span>
              <a href="${getPhoneLink(client.company, client.phone)}" target="_blank" class="m3-link truncate">
                ${client.phone}
              </a>
            </div>
            <!-- Social Handle -->
            <div class="flex flex-col gap-0.5 col-span-2">
              <span class="text-[9px] font-bold text-material-textMuted uppercase tracking-wider">Instagram / Socials</span>
              <a href="${getSocialLink(client.company, client.social)}" target="_blank" class="m3-link truncate">
                ${client.social}
              </a>
            </div>
          </div>

          <!-- The Trojan Horse Pitch -->
          <div class="bg-material-surfaceVariant/45 rounded-2xl p-3 border border-material-outlineVariant/10 flex flex-col gap-1.5">
            <span class="text-[9px] font-bold text-material-textMuted uppercase tracking-wider">The "Trojan Horse" Pitch</span>
            <a href="${getPitchLink(client.company, client.pitch)}" target="_blank" class="text-xs text-material-textSecondary hover:text-material-primary leading-relaxed hover:underline block">
              &ldquo;${client.pitch}&rdquo;
            </a>
          </div>

          <!-- Bottom interactive controls (Status & Response) -->
          <div class="flex items-center justify-between gap-3 pt-1">
            <!-- Outlined Select Status -->
            <div class="flex-grow max-w-[170px]">
              <select onchange="updateClientField(${client.id}, 'status', this.value)" class="w-full appearance-none bg-material-surface border border-material-outline rounded-full px-4.5 py-1.5 text-xs text-material-textSecondary font-medium focus:outline-none focus:border-material-primary cursor-pointer">
                <option value="Target Locked" ${client.status === 'Target Locked' ? 'selected' : ''}>Target Locked</option>
                <option value="Warm Contact" ${client.status === 'Warm Contact' ? 'selected' : ''}>Warm Contact</option>
                <option value="Proposal Sent" ${client.status === 'Proposal Sent' ? 'selected' : ''}>Proposal Sent</option>
                <option value="Closed Won" ${client.status === 'Closed Won' ? 'selected' : ''}>Closed Won</option>
                <option value="Closed Lost" ${client.status === 'Closed Lost' ? 'selected' : ''}>Closed Lost</option>
              </select>
            </div>
            
            <!-- Response Toggle Button (Material Pill Switch) -->
            <button onclick="toggleResponse(${client.id})" class="flex items-center gap-1.5 px-4.5 py-1.5 rounded-full text-xs font-semibold border transition-all ${client.response === 'Yes' ? 'bg-emerald-500/10 border-emerald-500/50 text-emerald-400' : 'bg-transparent border-material-outline text-material-textSecondary'}">
              <span>Resp:</span>
              <span>${client.response === 'Yes' ? 'Yes' : 'No'}</span>
            </button>
          </div>
        `;
        
        container.appendChild(card);
      });
    }

    // Update Client Field Value
    function updateClientField(id, field, value) {
      const idx = clients.findIndex(c => c.id === id);
      if (idx === -1) return;
      
      clients[idx][field] = value;
      checkUnsavedChangesState();
      renderDashboard();
    }

    // Toggle client response status
    function toggleResponse(id) {
      const idx = clients.findIndex(c => c.id === id);
      if (idx === -1) return;
      
      const newResponse = clients[idx].response === 'Yes' ? 'No' : 'Yes';
      updateClientField(id, 'response', newResponse);
      showToast(`${clients[idx].company} response changed to: ${newResponse}`, 'info');
    }

    // Verify change status against original fetch
    function checkUnsavedChangesState() {
      hasUnsavedChanges = JSON.stringify(clients) !== JSON.stringify(originalClients);
      updateSyncStatus(hasUnsavedChanges);
    }

    // Sync button status colors
    function updateSyncStatus(unsaved) {
      const badge = document.getElementById('sync-badge');
      const saveBtn = document.getElementById('save-btn');
      
      if (unsaved) {
        badge?.classList.remove('hidden');
        if (saveBtn) {
          saveBtn.className = "fixed bottom-6 right-6 flex items-center justify-center gap-2 bg-[#ffb4ab] hover:bg-[#ffdad6] text-[#690005] font-semibold py-4 px-5 rounded-[16px] shadow-lg transition-transform hover:scale-105 active:scale-95 animate-bounce z-40";
        }
      } else {
        badge?.classList.add('hidden');
        if (saveBtn) {
          saveBtn.className = "fixed bottom-6 right-6 flex items-center justify-center gap-2 bg-[#a8c7fa] hover:bg-[#c4d7ff] text-[#062e6f] font-semibold py-4 px-5 rounded-[16px] shadow-lg transition-transform hover:scale-105 active:scale-95 z-40";
        }
      }
    }

    // Auth Modal Controls
    function openAuthModal() {
      document.getElementById('auth-modal')?.classList.remove('hidden');
      const input = document.getElementById('pat-input');
      if (input) {
        input.value = '';
        input.focus();
      }
    }

    function closeAuthModal() {
      document.getElementById('auth-modal')?.classList.add('hidden');
      const input = document.getElementById('pat-input');
      if (input) input.value = '';
    }

    // Custom M3 Bottom Toast Feedback
    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;

      const toast = document.createElement('div');
      toast.className = 'p-3.5 rounded-[12px] shadow-xl text-xs font-semibold text-center border pointer-events-auto transition-opacity duration-300';
      
      if (type === 'success') {
        toast.className += ' bg-[#0f2d1e] border-emerald-500/40 text-emerald-300';
      } else if (type === 'error') {
        toast.className += ' bg-[#3b0b0f] border-rose-500/40 text-rose-300';
      } else {
        toast.className += ' bg-[#1a1c22] border-material-outlineVariant text-material-textSecondary';
      }

      toast.textContent = message;
      container.appendChild(toast);

      setTimeout(() => {
        toast.classList.add('opacity-0');
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    // Safe UTF-8 to base64
    function encodeBase64(str) {
      return btoa(unescape(encodeURIComponent(str)));
    }

    // PUSH DATA TO GITHUB VIA REST API
    async function executeGitSync() {
      const patInput = document.getElementById('pat-input');
      let token = patInput ? patInput.value.trim() : '';

      if (!token) {
        showToast('Valid GitHub token is required.', 'error');
        return;
      }

      closeAuthModal();
      showToast('Contacting GitHub...', 'info');

      const url = 'https://api.github.com/repos/smdhussain06/trailwebsite/contents/data.json';
      let sha = null;

      try {
        const getResponse = await fetch(url, {
          method: 'GET',
          headers: {
            'Authorization': `token ${token}`,
            'Accept': 'application/vnd.github.v3+json',
            'Cache-Control': 'no-cache'
          }
        });

        if (getResponse.ok) {
          const contents = await getResponse.json();
          sha = contents.sha;
        } else if (getResponse.status !== 404) {
          throw new Error('Connection refused by API');
        }

        const putBody = {
          message: 'Update client records via Material CRM',
          content: encodeBase64(JSON.stringify(clients, null, 2))
        };
        if (sha) putBody.sha = sha;

        const putResponse = await fetch(url, {
          method: 'PUT',
          headers: {
            'Authorization': `token ${token}`,
            'Accept': 'application/vnd.github.v3+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(putBody)
        });

        if (!putResponse.ok) throw new Error('Failed to save file');

        originalClients = JSON.parse(JSON.stringify(clients));
        hasUnsavedChanges = false;
        updateSyncStatus(false);
        showToast('Sync successful!', 'success');
      } catch (err) {
        showToast('Sync failed: Network or Auth error', 'error');
      } finally {
        token = '';
        if (patInput) patInput.value = '';
      }
    }
  </script>
</body>
