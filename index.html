<!DOCTYPE html>
<html lang="en" class="dark h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sniper CRM | Sales Pipeline</title>
  
  <!-- SEO Meta Tags -->
  <meta name="description" content="High-ticket sales pipeline tracker with direct GitHub API database syncing.">
  <meta name="theme-color" content="#6366f1">
  
  <!-- PWA Manifest & Icons -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="logo.jpg">
  
  <!-- Google Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Outfit', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            glass: {
              card: 'rgba(15, 23, 42, 0.4)',
              border: 'rgba(255, 255, 255, 0.08)',
              hover: 'rgba(255, 255, 255, 0.12)',
            }
          },
          animation: {
            'pulse-glow': 'pulseGlow 2s infinite',
            'slide-in': 'slideIn 0.3s ease-out forwards',
            'fade-in': 'fadeIn 0.2s ease-out forwards',
          },
          keyframes: {
            pulseGlow: {
              '0%, 100%': { transform: 'scale(1)', boxShadow: '0 0 15px rgba(99, 102, 241, 0.4)' },
              '50%': { transform: 'scale(1.03)', boxShadow: '0 0 25px rgba(99, 102, 241, 0.7)' },
            },
            slideIn: {
              '0%': { transform: 'translateY(1rem)', opacity: '0' },
              '100%': { transform: 'translateY(0)', opacity: '1' },
            },
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            }
          }
        }
      }
    }
  </script>

  <style>
    /* Premium background grid effect */
    .bg-grid {
      background-size: 40px 40px;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
    }
    
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.8);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(99, 102, 241, 0.3);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(99, 102, 241, 0.5);
    }

    /* Glassmorphism custom components */
    .glass-panel {
      background: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.07);
    }
    .glass-input {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.2s ease;
    }
    .glass-input:focus {
      border-color: rgba(99, 102, 241, 0.6);
      box-shadow: 0 0 10px rgba(99, 102, 241, 0.25);
    }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-950 via-[#0B0F19] to-indigo-950 text-slate-100 min-h-screen font-sans antialiased relative overflow-x-hidden bg-grid pb-12">

  <!-- Glow effects behind elements -->
  <div class="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] bg-indigo-500/10 rounded-full blur-[120px] pointer-events-none"></div>
  <div class="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] bg-violet-600/10 rounded-full blur-[120px] pointer-events-none"></div>

  <!-- Header -->
  <header class="sticky top-0 z-40 w-full border-b border-white/5 glass-panel py-4 px-6 md:px-12 flex justify-between items-center">
    <div class="flex items-center gap-3">
      <!-- Target crosshair icon -->
      <div class="relative w-8 h-8 flex items-center justify-center border border-indigo-500/50 rounded-full bg-indigo-500/10 shadow-[0_0_10px_rgba(99,102,241,0.3)]">
        <div class="w-4 h-4 border border-indigo-400 rounded-full"></div>
        <div class="absolute w-[2px] h-8 bg-indigo-400/50"></div>
        <div class="absolute w-8 h-[2px] bg-indigo-400/50"></div>
        <div class="w-1 h-1 bg-indigo-300 rounded-full absolute"></div>
      </div>
      <div>
        <h1 class="text-lg md:text-xl font-extrabold tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-white via-indigo-200 to-indigo-400">
          SNIPER // PIPELINE
        </h1>
        <p class="text-[10px] tracking-widest text-slate-400 font-mono">GIT-BACKED CRM v1.0</p>
      </div>
    </div>
    
    <div class="flex items-center gap-3">
      <!-- Sync Status Badge -->
      <div id="sync-badge" class="hidden md:flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-mono border border-slate-500/20 bg-slate-500/10 text-slate-400">
        <span class="w-2 h-2 rounded-full bg-slate-500"></span>
        <span>Unsaved</span>
      </div>
      
      <!-- Action Buttons -->
      <button id="save-btn" onclick="openAuthModal()" class="flex items-center gap-2 px-4 py-2 bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white rounded-xl text-sm font-semibold transition-all shadow-[0_4px_20px_rgba(99,102,241,0.2)] hover:shadow-[0_4px_25px_rgba(99,102,241,0.4)] disabled:opacity-50 disabled:cursor-not-allowed">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path>
        </svg>
        Save Changes to Git
      </button>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="max-w-7xl mx-auto px-4 md:px-8 py-8">
    
    <!-- Dashboard Stats Grid -->
    <section class="grid grid-cols-2 md:grid-cols-5 gap-4 mb-8">
      <!-- Total Leads Card -->
      <div class="glass-panel rounded-2xl p-4 flex flex-col justify-between border-white/5 relative overflow-hidden group">
        <div class="absolute -right-2 -bottom-2 w-12 h-12 bg-white/5 rounded-full pointer-events-none transition-all group-hover:scale-150 duration-500"></div>
        <span class="text-xs text-slate-400 font-semibold tracking-wide uppercase">Total pipeline</span>
        <span id="stat-total" class="text-3xl font-extrabold mt-2 text-white">0</span>
      </div>
      
      <!-- Target Locked Card -->
      <div class="glass-panel rounded-2xl p-4 flex flex-col justify-between border-amber-500/10 relative overflow-hidden group">
        <div class="absolute -right-2 -bottom-2 w-12 h-12 bg-amber-500/5 rounded-full pointer-events-none transition-all group-hover:scale-150 duration-500"></div>
        <span class="text-xs text-amber-400 font-semibold tracking-wide uppercase flex items-center gap-1.5">
          <span class="w-1.5 h-1.5 rounded-full bg-amber-400"></span> Locked
        </span>
        <span id="stat-locked" class="text-3xl font-extrabold mt-2 text-amber-300">0</span>
      </div>

      <!-- In Conversation Card -->
      <div class="glass-panel rounded-2xl p-4 flex flex-col justify-between border-violet-500/10 relative overflow-hidden group">
        <div class="absolute -right-2 -bottom-2 w-12 h-12 bg-violet-500/5 rounded-full pointer-events-none transition-all group-hover:scale-150 duration-500"></div>
        <span class="text-xs text-violet-400 font-semibold tracking-wide uppercase flex items-center gap-1.5">
          <span class="w-1.5 h-1.5 rounded-full bg-violet-400"></span> Pitching
        </span>
        <span id="stat-pitching" class="text-3xl font-extrabold mt-2 text-violet-300">0</span>
      </div>

      <!-- Closed Won Card -->
      <div class="glass-panel rounded-2xl p-4 flex flex-col justify-between border-emerald-500/10 relative overflow-hidden group">
        <div class="absolute -right-2 -bottom-2 w-12 h-12 bg-emerald-500/5 rounded-full pointer-events-none transition-all group-hover:scale-150 duration-500"></div>
        <span class="text-xs text-emerald-400 font-semibold tracking-wide uppercase flex items-center gap-1.5">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span> Won
        </span>
        <span id="stat-won" class="text-3xl font-extrabold mt-2 text-emerald-300">0</span>
      </div>

      <!-- Closed Lost Card -->
      <div class="glass-panel rounded-2xl p-4 flex flex-col justify-between border-rose-500/10 relative overflow-hidden group col-span-2 md:col-span-1">
        <div class="absolute -right-2 -bottom-2 w-12 h-12 bg-rose-500/5 rounded-full pointer-events-none transition-all group-hover:scale-150 duration-500"></div>
        <span class="text-xs text-rose-400 font-semibold tracking-wide uppercase flex items-center gap-1.5">
          <span class="w-1.5 h-1.5 rounded-full bg-rose-400"></span> Lost
        </span>
        <span id="stat-lost" class="text-3xl font-extrabold mt-2 text-rose-300">0</span>
      </div>
    </section>

    <!-- Filters and Search Controls -->
    <section class="glass-panel rounded-2xl p-4 md:p-6 mb-8 border-white/5 flex flex-col md:flex-row md:items-center justify-between gap-4">
      <!-- Search Input -->
      <div class="relative flex-1 max-w-md">
        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
          </svg>
        </span>
        <input type="text" id="search-input" placeholder="Search Company, DM, or pitch..." oninput="filterClients()" class="w-full pl-10 pr-4 py-2.5 rounded-xl text-sm text-slate-100 placeholder-slate-400 glass-input focus:outline-none">
      </div>
      
      <!-- Category Tabs (Filter Button Bar) -->
      <div class="flex flex-wrap gap-2">
        <button onclick="setFilter('All')" class="tab-btn px-4.5 py-2 rounded-xl text-xs font-semibold tracking-wide uppercase transition-all duration-200 border border-white/5 bg-white/5 text-indigo-300 shadow-inner">
          All
        </button>
        <button onclick="setFilter('Target Locked')" class="tab-btn px-4.5 py-2 rounded-xl text-xs font-semibold tracking-wide uppercase transition-all duration-200 border border-transparent text-slate-400 hover:text-slate-200">
          Locked
        </button>
        <button onclick="setFilter('Warm Contact')" class="tab-btn px-4.5 py-2 rounded-xl text-xs font-semibold tracking-wide uppercase transition-all duration-200 border border-transparent text-slate-400 hover:text-slate-200">
          Pitching
        </button>
        <button onclick="setFilter('Closed Won')" class="tab-btn px-4.5 py-2 rounded-xl text-xs font-semibold tracking-wide uppercase transition-all duration-200 border border-transparent text-slate-400 hover:text-slate-200">
          Won
        </button>
        <button onclick="setFilter('Closed Lost')" class="tab-btn px-4.5 py-2 rounded-xl text-xs font-semibold tracking-wide uppercase transition-all duration-200 border border-transparent text-slate-400 hover:text-slate-200">
          Lost
        </button>
      </div>
    </section>

    <!-- Clients Grid -->
    <section id="clients-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Loading placeholders -->
      <div class="animate-pulse glass-panel rounded-3xl p-6 h-56 border-white/5 flex flex-col justify-between">
        <div class="space-y-3">
          <div class="h-5 bg-white/10 rounded-full w-2/3"></div>
          <div class="h-4 bg-white/10 rounded-full w-1/3"></div>
        </div>
        <div class="h-10 bg-white/10 rounded-xl"></div>
      </div>
      <div class="animate-pulse glass-panel rounded-3xl p-6 h-56 border-white/5 flex flex-col justify-between">
        <div class="space-y-3">
          <div class="h-5 bg-white/10 rounded-full w-2/3"></div>
          <div class="h-4 bg-white/10 rounded-full w-1/3"></div>
        </div>
        <div class="h-10 bg-white/10 rounded-xl"></div>
      </div>
      <div class="animate-pulse glass-panel rounded-3xl p-6 h-56 border-white/5 flex flex-col justify-between">
        <div class="space-y-3">
          <div class="h-5 bg-white/10 rounded-full w-2/3"></div>
          <div class="h-4 bg-white/10 rounded-full w-1/3"></div>
        </div>
        <div class="h-10 bg-white/10 rounded-xl"></div>
      </div>
    </section>

  </main>

  <!-- PWA Install Banner -->
  <div id="pwa-banner" class="hidden fixed bottom-6 left-6 right-6 md:left-auto md:right-6 md:w-96 glass-panel rounded-2xl p-4 border-indigo-500/20 shadow-2xl z-40 flex items-center justify-between animate-slide-in">
    <div class="flex items-center gap-3">
      <img src="logo.jpg" alt="Logo" class="w-10 h-10 rounded-lg">
      <div>
        <p class="text-sm font-bold text-white">Install Sniper CRM</p>
        <p class="text-xs text-slate-400">Access CRM directly on your device</p>
      </div>
    </div>
    <button id="pwa-install-btn" class="px-3.5 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-bold transition-all shadow-md">Install</button>
  </div>

  <!-- On-Demand GitHub Authentication Modal -->
  <div id="auth-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md animate-fade-in">
    <div class="glass-panel w-full max-w-md rounded-3xl p-6 md:p-8 border-white/10 shadow-2xl animate-slide-in relative">
      <button onclick="closeAuthModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-200 transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>

      <div class="text-center mb-6">
        <div class="w-12 h-12 bg-indigo-500/10 text-indigo-400 rounded-full flex items-center justify-center mx-auto mb-4 border border-indigo-500/20">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
          </svg>
        </div>
        <h3 class="text-lg font-bold text-white">Enter GitHub PAT to Commit</h3>
        <p class="text-xs text-slate-400 mt-1.5">Enter your Personal Access Token to push changes to the repository</p>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Personal Access Token (PAT)</label>
          <input type="password" id="pat-input" placeholder="ghp_..." autocomplete="off" class="w-full px-4 py-3 rounded-xl text-sm text-slate-100 placeholder-slate-600 glass-input focus:outline-none font-mono">
        </div>
        <div class="flex gap-3 pt-2">
          <button onclick="closeAuthModal()" class="flex-1 py-3 bg-white/5 hover:bg-white/10 text-slate-300 rounded-xl text-sm font-semibold transition-colors border border-white/5">
            Cancel
          </button>
          <button onclick="executeGitSync()" class="flex-1 py-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-sm font-semibold transition-colors shadow-lg shadow-indigo-600/30">
            Execute Sync
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-3 max-w-sm w-full"></div>

  <!-- Javascript Logic -->
  <script>
    // State management variables
    let clients = [];
    let originalClients = [];
    let currentFilter = 'All';
    let hasUnsavedChanges = false;

    // Status Styling Definitions
    const statusConfig = {
      'Target Locked': {
        colorClass: 'amber',
        borderClass: 'border-amber-500/20 hover:border-amber-500/40',
        badgeBg: 'bg-amber-500/10 text-amber-400 border border-amber-500/20',
        bgGradient: 'from-amber-950/10 to-yellow-950/5',
        leftStrip: 'bg-gradient-to-b from-amber-400 to-yellow-500'
      },
      'Warm Contact': {
        colorClass: 'violet',
        borderClass: 'border-violet-500/20 hover:border-violet-500/40',
        badgeBg: 'bg-violet-500/10 text-violet-400 border border-violet-500/20',
        bgGradient: 'from-violet-950/10 to-indigo-950/5',
        leftStrip: 'bg-gradient-to-b from-violet-400 to-indigo-500'
      },
      'Proposal Sent': {
        colorClass: 'blue',
        borderClass: 'border-blue-500/20 hover:border-blue-500/40',
        badgeBg: 'bg-blue-500/10 text-blue-400 border border-blue-500/20',
        bgGradient: 'from-blue-950/10 to-sky-950/5',
        leftStrip: 'bg-gradient-to-b from-blue-400 to-sky-500'
      },
      'Closed Won': {
        colorClass: 'emerald',
        borderClass: 'border-emerald-500/20 hover:border-emerald-500/40',
        badgeBg: 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20',
        bgGradient: 'from-emerald-950/10 to-green-950/5',
        leftStrip: 'bg-gradient-to-b from-emerald-400 to-teal-500'
      },
      'Closed Lost': {
        colorClass: 'rose',
        borderClass: 'border-rose-500/20 hover:border-rose-500/40',
        badgeBg: 'bg-rose-500/10 text-rose-400 border border-rose-500/20',
        bgGradient: 'from-rose-950/10 to-red-950/5',
        leftStrip: 'bg-gradient-to-b from-rose-400 to-red-500'
      }
    };

    // Initialize application on load
    window.addEventListener('DOMContentLoaded', async () => {
      // Register Service Worker
      if ('serviceWorker' in navigator) {
        try {
          await navigator.serviceWorker.register('./sw.js');
          console.log('Service Worker registered successfully');
        } catch (err) {
          console.log('Service Worker registration failed: ', err);
        }
      }
      
      await loadData();
    });

    // PWA Install Event Handler
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const banner = document.getElementById('pwa-banner');
      if (banner) banner.classList.remove('hidden');
    });

    document.getElementById('pwa-install-btn')?.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        console.log(`PWA User response: ${outcome}`);
        deferredPrompt = null;
        const banner = document.getElementById('pwa-banner');
        if (banner) banner.classList.add('hidden');
      }
    });

    // Load Data logic: first try remote github pages URL, then fallback to local data.json, then fallback to local seeds
    async function loadData() {
      const gitUrl = 'https://raw.githubusercontent.com/smdhussain06/trailwebsite/main/data.json';
      const localUrl = './data.json';
      
      showToast('Loading database...', 'info');
      
      try {
        // Try getting remote database first
        const response = await fetch(gitUrl + '?t=' + new Date().getTime(), { cache: 'no-store' });
        if (!response.ok) throw new Error('Remote file not accessible');
        clients = await response.json();
        originalClients = JSON.parse(JSON.stringify(clients));
        showToast('Successfully synced with remote GitHub database', 'success');
        updateSyncStatus(false);
      } catch (err) {
        console.warn('Could not fetch remote database, attempting to fetch local: ', err.message);
        try {
          const localResponse = await fetch(localUrl + '?t=' + new Date().getTime());
          if (!localResponse.ok) throw new Error('Local file not accessible');
          clients = await localResponse.json();
          originalClients = JSON.parse(JSON.stringify(clients));
          showToast('Loaded local database copy', 'info');
          updateSyncStatus(false);
        } catch (localErr) {
          console.error('Failed to load database. Falling back to hardcoded seed.', localErr);
          // Hardcoded backup seed array
          clients = [
            { "id": 1, "company": "Anbre Interiors", "dm": "S.R. Balaji", "pitch": "Instant-load mobile UI framework", "status": "Target Locked" },
            { "id": 2, "company": "Empatio Architecture", "dm": "Ar. Chandhana Ramesh", "pitch": "Editorial-grade interactive lookbook", "status": "Target Locked" },
            { "id": 3, "company": "Hina Designer Boutique", "dm": "Rameez Hina", "pitch": "48-hour emergency e-commerce rescue", "status": "Target Locked" },
            { "id": 4, "company": "DA Eventz", "dm": "Punithan Bhaskaran", "pitch": "Backend PWA Logistics Tracker", "status": "Target Locked" },
            { "id": 5, "company": "Pawnwaala", "dm": "Mohanraj Sampathkumar", "pitch": "Secure database rebuild", "status": "Target Locked" },
            { "id": 6, "company": "PANTA Staffing", "dm": "Neelima P.", "pitch": "DNS restoration + AI Lead Engine", "status": "Target Locked" },
            { "id": 7, "company": "Branditude Corporate", "dm": "Bala Murugan N.", "pitch": "B2B bulk-ordering portal", "status": "Target Locked" },
            { "id": 8, "company": "Born Natural Agro", "dm": "Angel-Invested Team", "pitch": "High-performance D2C vault", "status": "Target Locked" },
            { "id": 9, "company": "Mudra Homecrafters", "dm": "Ramya Raj", "pitch": "Voice-to-BOQ agentic framework", "status": "Target Locked" },
            { "id": 10, "company": "The Architecture Story", "dm": "Deepak Jawahar", "pitch": "Agentic sales pipeline", "status": "Target Locked" }
          ];
          originalClients = JSON.parse(JSON.stringify(clients));
          showToast('Loaded hardcoded pipeline database', 'warning');
          updateSyncStatus(true);
        }
      }
      
      renderDashboard();
    }

    // Render stats & client cards
    function renderDashboard() {
      // 1. Calculate Stats
      const total = clients.length;
      const locked = clients.filter(c => c.status === 'Target Locked').length;
      const pitching = clients.filter(c => c.status === 'Warm Contact' || c.status === 'Proposal Sent').length;
      const won = clients.filter(c => c.status === 'Closed Won').length;
      const lost = clients.filter(c => c.status === 'Closed Lost').length;

      // Animate stat number changes
      animateNumber('stat-total', total);
      animateNumber('stat-locked', locked);
      animateNumber('stat-pitching', pitching);
      animateNumber('stat-won', won);
      animateNumber('stat-lost', lost);

      // 2. Render Cards
      filterClients();
    }

    // Micro-animation for stats numbers
    function animateNumber(elementId, targetValue) {
      const el = document.getElementById(elementId);
      if (!el) return;
      
      let currentValue = parseInt(el.textContent) || 0;
      if (currentValue === targetValue) return;

      const duration = 400; // ms
      const startTime = performance.now();

      function step(now) {
        const progress = Math.min((now - startTime) / duration, 1);
        const current = Math.floor(currentValue + (targetValue - currentValue) * progress);
        el.textContent = current;
        if (progress < 1) {
          requestAnimationFrame(step);
        } else {
          el.textContent = targetValue;
        }
      }
      requestAnimationFrame(step);
    }

    // Set filter category tab
    function setFilter(filter) {
      currentFilter = filter;
      
      // Update tab UI styles
      const tabs = document.querySelectorAll('.tab-btn');
      tabs.forEach(btn => {
        const text = btn.textContent.trim().toLowerCase();
        
        // Match buttons by name mapping
        let match = false;
        if (filter === 'All' && text === 'all') match = true;
        if (filter === 'Target Locked' && text === 'locked') match = true;
        if (filter === 'Warm Contact' && text === 'pitching') match = true;
        if (filter === 'Closed Won' && text === 'won') match = true;
        if (filter === 'Closed Lost' && text === 'lost') match = true;
        
        if (match) {
          btn.className = "tab-btn px-4.5 py-2 rounded-xl text-xs font-semibold tracking-wide uppercase transition-all duration-200 border border-white/5 bg-white/5 text-indigo-300 shadow-inner";
        } else {
          btn.className = "tab-btn px-4.5 py-2 rounded-xl text-xs font-semibold tracking-wide uppercase transition-all duration-200 border border-transparent text-slate-400 hover:text-slate-200";
        }
      });
      
      filterClients();
    }

    // Filter & search implementation
    function filterClients() {
      const searchQuery = document.getElementById('search-input').value.toLowerCase().trim();
      const container = document.getElementById('clients-container');
      
      if (!container) return;
      container.innerHTML = '';
      
      const filtered = clients.filter(c => {
        // Apply status tab filter
        if (currentFilter !== 'All') {
          if (currentFilter === 'Warm Contact') {
            // "Warm Contact" filter checks both Warm Contact and Proposal Sent under "Pitching" tab
            if (c.status !== 'Warm Contact' && c.status !== 'Proposal Sent') return false;
          } else {
            if (c.status !== currentFilter) return false;
          }
        }
        
        // Apply text search filter
        if (searchQuery) {
          const matchCompany = c.company.toLowerCase().includes(searchQuery);
          const matchDm = c.dm.toLowerCase().includes(searchQuery);
          const matchPitch = c.pitch.toLowerCase().includes(searchQuery);
          return matchCompany || matchDm || matchPitch;
        }
        
        return true;
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="col-span-full py-12 flex flex-col items-center justify-center text-slate-500">
            <svg class="w-12 h-12 mb-3 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            <p class="text-sm font-medium">No sales targets found</p>
          </div>
        `;
        return;
      }

      // Render cards
      filtered.forEach(client => {
        const config = statusConfig[client.status] || statusConfig['Target Locked'];
        const card = document.createElement('div');
        card.className = `glass-panel rounded-3xl p-6 border-white/5 relative overflow-hidden transition-all duration-300 ${config.borderClass} bg-gradient-to-br ${config.bgGradient} flex flex-col justify-between group`;
        card.id = `card-${client.id}`;
        
        card.innerHTML = `
          <!-- Status strip indicator on left -->
          <div class="absolute left-0 top-0 bottom-0 w-[4px] ${config.leftStrip}"></div>
          
          <div class="space-y-4">
            <div class="flex justify-between items-start">
              <div>
                <h4 class="text-lg font-bold text-white group-hover:text-indigo-200 transition-colors">${client.company}</h4>
                <p class="text-xs text-slate-400 mt-1 flex items-center gap-1.5 font-medium">
                  <svg class="w-3.5 h-3.5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                  </svg>
                  ${client.dm}
                </p>
              </div>
              <span class="text-[10px] font-bold px-2.5 py-1 rounded-full uppercase tracking-wider ${config.badgeBg}">
                ${client.status}
              </span>
            </div>
            
            <p class="text-sm text-slate-300 leading-relaxed italic bg-slate-900/40 p-3 rounded-xl border border-white/5 font-light">
              &ldquo;${client.pitch}&rdquo;
            </p>
          </div>
          
          <!-- Dropdown Status Selector -->
          <div class="mt-5 relative">
            <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-500 mb-1.5">Change Status</label>
            <div class="relative">
              <select onchange="updateClientStatus(${client.id}, this.value)" class="w-full appearance-none bg-slate-950/70 border border-white/10 rounded-xl px-4 py-2.5 text-xs text-slate-300 font-semibold focus:outline-none focus:ring-1 focus:ring-indigo-500 cursor-pointer">
                <option value="Target Locked" ${client.status === 'Target Locked' ? 'selected' : ''}>Target Locked</option>
                <option value="Warm Contact" ${client.status === 'Warm Contact' ? 'selected' : ''}>Warm Contact (Pitching)</option>
                <option value="Proposal Sent" ${client.status === 'Proposal Sent' ? 'selected' : ''}>Proposal Sent</option>
                <option value="Closed Won" ${client.status === 'Closed Won' ? 'selected' : ''}>Closed Won (Sold)</option>
                <option value="Closed Lost" ${client.status === 'Closed Lost' ? 'selected' : ''}>Closed Lost</option>
              </select>
              <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-400">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                </svg>
              </div>
            </div>
          </div>
        `;
        
        container.appendChild(card);
      });
    }

    // Update Client Status in State
    function updateClientStatus(id, newStatus) {
      const idx = clients.findIndex(c => c.id === id);
      if (idx === -1) return;
      
      clients[idx].status = newStatus;
      
      // Check if state deviates from originally loaded config
      hasUnsavedChanges = JSON.stringify(clients) !== JSON.stringify(originalClients);
      updateSyncStatus(hasUnsavedChanges);
      
      // Update UI elements for card and stats
      renderDashboard();
      showToast(`Status updated for ${clients[idx].company}`, 'info');
    }

    // Update the visual representation of sync status
    function updateSyncStatus(unsaved) {
      const badge = document.getElementById('sync-badge');
      const saveBtn = document.getElementById('save-btn');
      
      if (!badge || !saveBtn) return;
      
      if (unsaved) {
        badge.className = "flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-mono border border-amber-500/20 bg-amber-500/10 text-amber-400";
        badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-400 animate-ping"></span><span>Unsaved Changes</span>`;
        badge.classList.remove('hidden');
        
        // Make the save button pulse to attract attention
        saveBtn.className = "flex items-center gap-2 px-4 py-2 bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white rounded-xl text-sm font-semibold transition-all shadow-[0_4px_25px_rgba(99,102,241,0.5)] border border-indigo-400/30 animate-pulse-glow";
      } else {
        badge.className = "flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-mono border border-emerald-500/20 bg-emerald-500/10 text-emerald-400";
        badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-500"></span><span>Synced</span>`;
        badge.classList.remove('hidden');
        
        // Revert the save button
        saveBtn.className = "flex items-center gap-2 px-4 py-2 bg-white/5 hover:bg-white/10 text-slate-400 hover:text-white border border-white/10 rounded-xl text-sm font-semibold transition-all disabled:opacity-50";
      }
    }

    // Authentication modal visibility controls
    function openAuthModal() {
      const modal = document.getElementById('auth-modal');
      const input = document.getElementById('pat-input');
      
      if (modal) modal.classList.remove('hidden');
      if (input) {
        input.value = '';
        input.focus();
      }
    }

    function closeAuthModal() {
      const modal = document.getElementById('auth-modal');
      const input = document.getElementById('pat-input');
      
      if (modal) modal.classList.add('hidden');
      if (input) input.value = ''; // Clean up input immediately
    }

    // CUSTOM TOAST NOTIFICATIONS
    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;

      const toast = document.createElement('div');
      toast.className = 'glass-panel p-4 rounded-xl shadow-2xl flex items-center gap-3 border-white/10 animate-slide-in text-xs font-semibold';
      
      let icon = '';
      if (type === 'success') {
        toast.classList.add('border-emerald-500/20', 'bg-emerald-950/20');
        icon = `<svg class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;
      } else if (type === 'error') {
        toast.classList.add('border-rose-500/20', 'bg-rose-950/20');
        icon = `<svg class="w-5 h-5 text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;
      } else if (type === 'warning') {
        toast.classList.add('border-amber-500/20', 'bg-amber-950/20');
        icon = `<svg class="w-5 h-5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>`;
      } else {
        toast.classList.add('border-indigo-500/20', 'bg-indigo-950/20');
        icon = `<svg class="w-5 h-5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;
      }

      toast.innerHTML = `
        <div class="flex-shrink-0">${icon}</div>
        <div class="text-slate-200">${message}</div>
      `;

      container.appendChild(toast);

      // Auto-remove toast after 4s
      setTimeout(() => {
        toast.classList.add('opacity-0', 'transition-opacity', 'duration-300');
        setTimeout(() => toast.remove(), 300);
      }, 4000);
    }

    // UTF-8 friendly Base64 encoder
    function encodeBase64(str) {
      return btoa(unescape(encodeURIComponent(str)));
    }

    // GITHUB API SYNC LOGIC
    async function executeGitSync() {
      const patInput = document.getElementById('pat-input');
      let token = patInput ? patInput.value.trim() : '';
      
      if (!token) {
        showToast('Personal Access Token is required.', 'error');
        return;
      }
      
      closeAuthModal();
      showToast('Contacting GitHub REST API...', 'info');

      const url = 'https://api.github.com/repos/smdhussain06/trailwebsite/contents/data.json';
      let sha = null;

      try {
        // Step 1: GET current data.json from GitHub to retrieve the latest sha hash
        const getResponse = await fetch(url, {
          method: 'GET',
          headers: {
            'Authorization': `token ${token}`,
            'Accept': 'application/vnd.github.v3+json',
            'Cache-Control': 'no-cache'
          }
        });

        if (getResponse.ok) {
          const contents = await getResponse.json();
          sha = contents.sha;
          console.log(`Current file sha hash: ${sha}`);
        } else if (getResponse.status === 404) {
          console.log('Database file does not exist in repo yet. Proceeding with initial creation.');
        } else {
          const errText = await getResponse.text();
          throw new Error(`Failed to read repository metadata: ${getResponse.statusText} (${errText})`);
        }

        // Step 2: PUT updated JSON content directly back to the repo using the sha
        const updatedJson = JSON.stringify(clients, null, 2);
        const base64Content = encodeBase64(updatedJson);

        const putBody = {
          message: 'Update client statuses via Sniper CRM',
          content: base64Content
        };
        if (sha) {
          putBody.sha = sha;
        }

        showToast('Committing database updates to Git...', 'info');

        const putResponse = await fetch(url, {
          method: 'PUT',
          headers: {
            'Authorization': `token ${token}`,
            'Accept': 'application/vnd.github.v3+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(putBody)
        });

        if (!putResponse.ok) {
          const errText = await putResponse.text();
          throw new Error(`Failed to write database file: ${putResponse.statusText} (${errText})`);
        }

        // Sync local storage state
        originalClients = JSON.parse(JSON.stringify(clients));
        hasUnsavedChanges = false;
        updateSyncStatus(false);
        showToast('Database committed successfully to GitHub Pages!', 'success');

      } catch (err) {
        console.error('Git integration error: ', err);
        showToast(err.message, 'error');
      } finally {
        // SECURITY HYGIENE: immediately clear the token from variables and DOM
        token = '';
        if (patInput) patInput.value = '';
        console.log('GitHub Personal Access Token cleared from memory.');
      }
    }
  </script>
